<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="24" fill="url(#bg-grad)" />
  <rect width="1196" height="396" x="2" y="2" rx="22" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Background Decorative Grid & Glows -->
  <circle cx="200" cy="200" r="160" fill="#0284c7" opacity="0.15" filter="url(#glow-strong)">
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="200" r="180" fill="#7c3aed" opacity="0.12" filter="url(#glow-strong)">
    <animate attributeName="opacity" values="0.10;0.20;0.10" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Data Streams -->
  <path d="M-50,120 Q300,50 600,120 T1250,80" fill="none" stroke="url(#flow-cyan)" stroke-width="3" opacity="0.6">
    <animate attributeName="d" values="M-50,120 Q300,50 600,120 T1250,80; M-50,140 Q300,80 600,100 T1250,120; M-50,120 Q300,50 600,120 T1250,80" dur="8s" repeatCount="indefinite" />
  </path>
  <path d="M-50,280 Q300,340 600,280 T1250,300" fill="none" stroke="url(#accent-grad)" stroke-width="2.5" opacity="0.4">
    <animate attributeName="d" values="M-50,280 Q300,340 600,280 T1250,300; M-50,260 Q300,310 600,300 T1250,270; M-50,280 Q300,340 600,280 T1250,300" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Left Icon Section: Glowing Blockchain Coin / Orbits -->
  <g transform="translate(140, 200)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="85" ry="35" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" transform="rotate(-20)">
      <animateTransform attributeName="transform" type="rotate" from="-20" to="340" dur="18s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="0" cy="0" rx="85" ry="35" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4" transform="rotate(40)">
      <animateTransform attributeName="transform" type="rotate" from="40" to="-320" dur="22s" repeatCount="indefinite" />
    </ellipse>

    <!-- Glowing Coin -->
    <circle cx="0" cy="0" r="42" fill="url(#gold-grad)" filter="url(#glow)">
      <animate attributeName="r" values="40;44;40" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="34" fill="#0f172a" />
    
    <!-- Coin Icon -->
    <text x="0" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="url(#gold-grad)" text-anchor="middle">CF</text>

    <!-- Satellite Nodes -->
    <circle cx="80" cy="-20" r="8" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cy" values="-20;-10;-20" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="-75" cy="25" r="7" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cy" values="25;15;25" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Content Center / Right -->
  <g transform="translate(300, 130)">
    <!-- Super Header Badge -->
    <rect x="0" y="-42" width="340" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="-27" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">NEXT-GEN L1 PAYMENT PROTOCOL</text>

    <!-- Project Title -->
    <text x="0" y="35" class="title-text" fill="url(#accent-grad)" filter="url(#glow)">CoinsFlow</text>

    <!-- Subtitle -->
    <text x="0" y="80" class="subtitle-text">Infinitely Scalable Blockchain Protocol for Global Payments</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 120)">
      <!-- Pill 1: 1M+ TPS -->
      <g>
        <rect x="0" y="0" width="130" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="65" y="23" class="badge-text" text-anchor="middle">🚀 1,000,000+ TPS</text>
      </g>
      <!-- Pill 2: Sub-Second Finality -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="155" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
        <text x="77" y="23" class="badge-text" text-anchor="middle">⚡ Sub-Second Finality</text>
      </g>
      <!-- Pill 3: Near-Zero Fees -->
      <g transform="translate(315, 0)">
        <rect x="0" y="0" width="135" height="36" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
        <text x="67" y="23" class="badge-text" text-anchor="middle">💸 &lt;$0.0001 Fees</text>
      </g>
      <!-- Pill 4: Native EVM -->
      <g transform="translate(465, 0)">
        <rect x="0" y="0" width="145" height="36" rx="18" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
        <text x="72" y="23" class="badge-text" text-anchor="middle">🔗 EVM Compatible</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Network Nodes -->
  <g transform="translate(1080, 200)">
    <line x1="-50" y1="-60" x2="0" y2="0" stroke="#334155" stroke-width="2" />
    <line x1="40" y1="-40" x2="0" y2="0" stroke="#334155" stroke-width="2" />
    <line x1="-40" y1="50" x2="0" y2="0" stroke="#334155" stroke-width="2" />
    <line x1="50" y1="40" x2="0" y2="0" stroke="#334155" stroke-width="2" />
    
    <circle cx="-50" cy="-60" r="6" fill="#38bdf8" />
    <circle cx="40" cy="-40" r="5" fill="#818cf8" />
    <circle cx="-40" cy="50" r="5" fill="#c084fc" />
    <circle cx="50" cy="40" r="7" fill="#22c55e" />
    <circle cx="0" cy="0" r="10" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="9;12;9" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>